[package]
name = "kern"
version = "0.1.3"
description = "Kern — a local-first personal productivity workspace"
authors = ["Christian Relf"]
edition = "2021"
rust-version = "1.80"

[lib]
name = "kern_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = ["tray-icon", "protocol-asset", "image-png"] }
tauri-plugin-dialog = "2"
tauri-plugin-notification = "2"
tauri-plugin-autostart = "2"
tauri-plugin-global-shortcut = "2"
tauri-plugin-opener = "2"
tauri-plugin-single-instance = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
rusqlite = { version = "0.40", features = ["bundled", "backup"] }
chrono = { version = "0.4", default-features = false, features = ["clock", "std"] }
uuid = { version = "1", features = ["v7"] }
zip = { version = "9", default-features = false, features = ["deflate"] }
thiserror = "2"
ureq = { version = "3", default-features = false, features = ["rustls"] }
base64 = "0.22"
semver = "1"
sha2 = "0.10"
# Moves files from the project file browser to the Recycle Bin / Trash.
os_trash = { package = "trash", version = "5" }

url = "2"

# AI API keys live in the operating system's credential store, never in SQLite.
[target.'cfg(windows)'.dependencies]
keyring = { version = "3.6", features = ["windows-native"] }
[target.'cfg(target_os = "macos")'.dependencies]
keyring = { version = "3.6", features = ["apple-native"] }
[target.'cfg(target_os = "linux")'.dependencies]
keyring = { version = "3.6", features = ["linux-native-sync-persistent", "crypto-rust"] }

[dev-dependencies]
tempfile = "3"

[profile.release]
codegen-units = 1
lto = true
opt-level = "s"
panic = "abort"
strip = true
