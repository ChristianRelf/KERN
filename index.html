<!doctype html>
<html lang="en" data-theme="dark" data-density="comfortable">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="color-scheme" content="dark light" />
    <title>Kern</title>
    <style>
      html,body{background:#111111;margin:0}
      /* Startup splash: painted before the bundle loads, removed by App once
         settings are in. Fades in late so fast launches never flash it. */
      #splash{position:fixed;inset:0;z-index:9999;display:grid;place-items:center;background:#111111;transition:opacity 180ms ease}
      #splash[data-hidden]{opacity:0;pointer-events:none}
      #splash .splash__inner{display:flex;flex-direction:column;align-items:center;gap:22px;opacity:0;animation:splash-in 240ms ease 250ms forwards}
      #splash .splash__spinner{width:18px;height:18px;border-radius:50%;border:2px solid #2a2a2a;border-top-color:#9a9a9a;animation:splash-spin 800ms linear infinite}
      @keyframes splash-in{to{opacity:1}}
      @keyframes splash-spin{to{transform:rotate(360deg)}}
      @media (prefers-reduced-motion:reduce){#splash .splash__spinner{animation-duration:2.4s}}
    </style>
  </head>
  <body>
    <div id="splash" role="status" aria-label="Loading Kern">
      <div class="splash__inner">
        <img src="/assets/icon.svg" width="56" height="56" alt="" />
        <div class="splash__spinner"></div>
      </div>
    </div>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
